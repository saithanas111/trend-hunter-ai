name: Trend Hunter AI

concurrency:
  group: trend-hunter-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "prepare_queue.py"
      - "daraz_candidates.json"
      - ".github/workflows/trend-hunter.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  run-trend-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Trend Hunter AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python main.py

      - name: Prepare structured content queue
        run: python prepare_queue.py

      - name: Generate vertical product Reels
        run: python generate_reel.py

      - name: Validate queue safety
        run: python validate_queue.py

      - name: Save dated report
        run: |
          mkdir -p reports
          cp trend_report.md "reports/$(date -u +%Y-%m-%d-%H-%M).md"

      - name: Commit report history
        run: |
          git config user.name "Trend Hunter AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ content_queue.json content_queue.csv
          if [ -d assets ] && find assets -type f -print -quit | grep -q .; then git add assets/; fi
          git diff --cached --quiet || git commit -m "Save Trend Hunter report history"
          git stash push --include-untracked -m "generated queue files"
          git pull --rebase origin main
          git push

      - name: Upload latest report
        uses: actions/upload-artifact@v4
        with:
          name: trend-hunter-report
          path: |
            trend_report.md
            content_queue.json
            content_queue.csv
          if-no-files-found: error
          retention-days: 90
