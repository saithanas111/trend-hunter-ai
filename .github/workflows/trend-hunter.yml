name: Trend Hunter AI

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - ".github/workflows/trend-hunter.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  run-trend-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Trend Hunter AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Save dated report
        run: |
          mkdir -p reports
          cp trend_report.md "reports/$(date -u +%Y-%m-%d-%H-%M).md"

      - name: Commit report history
        run: |
          git config user.name "Trend Hunter AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Save Trend Hunter report history"
          git push

      - name: Upload latest report
        uses: actions/upload-artifact@v4
        with:
          name: trend-hunter-report
          path: trend_report.md
          if-no-files-found: error
          retention-days: 90
